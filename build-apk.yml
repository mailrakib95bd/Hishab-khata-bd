name: Build Android APK

# Actions ট্যাব → "Build Android APK" → Run workflow চাপলে বিল্ড হয়।
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # প্রতিবার নতুন র‍্যান্ডম debug key দিয়ে সাইন হলে ফোনে আগের ভার্সনের
      # উপর "adb install -r" (বা Play Store-এর মতো আপডেট) কাজ করে না —
      # "signatures do not match" এরর দেয়। তাই রিপোতে কমিট করা এই একই
      # debug.keystore সবসময় ব্যবহার করা হয়, যাতে প্রতিটা বিল্ডের স্বাক্ষর
      # সবসময় অভিন্ন থাকে।
      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      # Capacitor 7 needs Node 20+
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App (www/)
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # android/ is generated fresh each run (it is not committed)
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HishabKhata-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
