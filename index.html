<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>হিসাব-খাতা</title>

<meta name="theme-color" content="#0F5B46" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="হিসাব-খাতা" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; background: #101716; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
</style>

<!-- React + ReactDOM (production builds). app.js is already plain compiled
     JavaScript (no JSX), so no in-browser Babel is needed — loads fast and
     reliably even on a slow connection. -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#F1EEE5;font-family:sans-serif;font-size:14px;">
    লোড হচ্ছে…
  </div>
</div>

<script>
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) return null;
      return { key, value: v, shared: false };
    },
    async set(key, value) {
      try {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      } catch (e) {
        return null;
      }
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>

<!-- optional cloud account / backup layer — native ES module, loads
     straight from Firebase's CDN. If there's no internet this simply never
     runs; the app below is fully functional without it (local-only mode). -->
<script type="module" src="./firebase-init.js"></script>

<!-- app.js is already plain compiled JavaScript (no JSX) -->
<script src="./app.js"></script>
</body>
</html>
